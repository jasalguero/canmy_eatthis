name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # AGENTS.md #3 — "safe" is never a bare claim in user-facing strings.
      - name: Check for bare "safe" claims
        run: ./scripts/check-safe-claims.sh

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
