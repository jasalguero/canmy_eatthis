name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Weekly, so a new Expo patch release fails a run on its own schedule rather than whichever push
  # happens to come next (see the Expo dependency check below). Monday 07:00 UTC.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node, or `cache: pnpm` fails with "Unable to locate
      # executable file: pnpm". The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # AGENTS.md #3 — "safe" is never a bare claim in user-facing strings.
      - name: Check for bare "safe" claims
        run: ./scripts/check-safe-claims.sh

      # AGENTS.md #6 — no API key in any committed file, ever.
      - name: Check for committed API keys
        run: ./scripts/check-no-secrets.sh

      # docs/06 §1 — every verdict token pair passes WCAG AA, computed from the token file.
      # "Add a CI check that computes contrast ratios; do not eyeball it."
      - name: Check colour contrast
        run: node scripts/check-contrast.mjs

      # docs/06 §1–§2 — no colour literals outside theme/, no default-palette classes,
      # logical layout properties only.
      - name: Check UI hygiene
        run: ./scripts/check-ui-hygiene.sh

      # Native package versions must match what the installed Expo SDK expects. A mismatch does
      # not fail typecheck, lint, tests or the web build — but it breaks the app on device: a
      # react-native-worklets outside react-native-reanimated's peer range made every route throw
      # "undefined is not a function" at import on iOS while web ran perfectly.
      #
      # The check compares against Expo's *latest* SDK patch releases, so it also fails whenever
      # Expo publishes one, with no change in this repo. On pushes and pull requests a failure is
      # therefore a warning annotation, not a red build; the weekly scheduled run (and a manual
      # run) fails outright. The fix is always the same: `npx expo install --fix` in apps/mobile.
      # The output cannot tell a new patch from a real mismatch, so treat the warning as a to-do.
      - name: Check Expo SDK dependency versions
        env:
          BLOCKING: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if pnpm --filter @canmyeatthis/mobile run check:deps; then exit 0; fi
          if [ "$BLOCKING" = "true" ]; then exit 1; fi
          echo "::warning title=Expo dependencies out of date::Run 'npx expo install --fix' in apps/mobile and commit. This fails the weekly scheduled CI run until fixed."

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # docs/02-tech-decisions.md D21 — the bundled KB (app and Worker both) is a committed
      # snapshot, not fetched OTA. Re-running the sync and diffing catches an author editing
      # packages/kb/data without re-running `pnpm --filter kb run sync:assets`, which would
      # otherwise ship a stale KB to either consumer.
      - name: Check bundled KB snapshots are up to date
        run: |
          pnpm --filter @canmyeatthis/kb run sync:assets
          git diff --exit-code apps/mobile/assets/kb services/api/src/kb-data
