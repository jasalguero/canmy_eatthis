name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # AGENTS.md #3 — "safe" is never a bare claim in user-facing strings.
      - name: Check for bare "safe" claims
        run: ./scripts/check-safe-claims.sh

      # docs/06 §1 — every verdict token pair passes WCAG AA, computed from the token file.
      # "Add a CI check that computes contrast ratios; do not eyeball it."
      - name: Check colour contrast
        run: node scripts/check-contrast.mjs

      # docs/06 §1–§2 — no colour literals outside theme/, no default-palette classes,
      # logical layout properties only.
      - name: Check UI hygiene
        run: ./scripts/check-ui-hygiene.sh

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
