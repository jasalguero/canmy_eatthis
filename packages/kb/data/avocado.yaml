id: avocado
display_name:
  en: Avocado
  es: Aguacate
category: food
aliases:
  en: [avocado, avocados, guacamole, avocado pit, avocado leaves, palta]
  es: [aguacate, aguacates, palta, paltas, guacamole, hueso de aguacate, semilla de aguacate]
confusable_with: []
is_ingredient: true
high_risk: false
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best avoided for dogs.
      es: Mejor evitarlo en perros.
    summary:
      en: Avocado flesh contains persin, which mostly just upsets a dog's stomach rather than causing serious poisoning. The bigger risk is the pit, which can choke a dog or block its gut, and the fat content can trigger pancreatitis in a large amount.
      es: La pulpa del aguacate contiene persina, que en los perros suele provocar solo molestias digestivas y no una intoxicación grave. El riesgo mayor es el hueso, que puede atragantar al perro u obstruirle el intestino, y su alto contenido en grasa puede provocar pancreatitis si se come en cantidad.
    signs: [vomiting, diarrhoea, abdominal_pain]
    onset_hours: { min: 0, max: 24 }
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best avoided for cats.
      es: Mejor evitarlo en gatos.
    summary:
      en: Cats are less likely to eat avocado than dogs, and reported effects are similarly mild — mostly stomach upset from the persin and fat content, rather than the severe reactions seen in birds or livestock.
      es: Los gatos comen aguacate con menos frecuencia que los perros, y los efectos descritos son igual de leves — sobre todo molestias digestivas por la persina y la grasa, no las reacciones graves que se ven en aves o ganado.
    signs: [vomiting, diarrhoea, abdominal_pain]
    onset_hours: { min: 0, max: 24 }
    emergency_actions: []
sources:
