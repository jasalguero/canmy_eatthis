id: avocado
display_name:
  en: Avocado
  es: Aguacate
category: food
aliases:
  en: [avocado, avocados, guacamole, avocado pit, avocado leaves, palta]
  es: [aguacate, aguacates, palta, paltas, guacamole, hueso de aguacate, semilla de aguacate]
confusable_with: []
is_ingredient: true
high_risk: false
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best avoided for dogs.
      es: Mejor evitarlo en perros.
    summary:
      en: "Avocado is only mildly toxic to dogs, which are relatively resistant to it. The bigger risk is the pit, which can block a dog's gut if swallowed whole. Call your vet if your dog swallowed a pit or seems unwell."
      es: "El aguacate es solo levemente tóxico para los perros, que son relativamente resistentes a él. El riesgo mayor es el hueso, que puede obstruir el intestino si se lo traga entero. Llama a tu veterinario si tu perro se ha tragado un hueso o no se encuentra bien."
    signs: []
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best avoided for cats.
      es: Mejor evitarlo en gatos.
    summary:
      en: "Avocado is only mildly toxic to cats; it is far more dangerous to birds, rabbits, horses and farm animals. Call your vet if your cat ate a lot or seems unwell."
      es: "El aguacate es solo levemente tóxico para los gatos; es mucho más peligroso para aves, conejos, caballos y animales de granja. Llama a tu veterinario si tu gato ha comido mucho o no se encuentra bien."
    signs: []
    onset_hours: null
    emergency_actions: []
