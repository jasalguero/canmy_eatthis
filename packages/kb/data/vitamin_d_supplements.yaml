  - label: Merck Veterinary Manual — Toxicoses in Animals From Human Multivitamins and Supplements
    url: https://www.merckvetmanual.com/toxicology/toxicoses-from-human-vitamins-minerals-and-dietary-supplements/toxicoses-in-animals-from-human-multivitamins-and-supplements
