id: alliums
display_name:
  en: Onion, garlic, leek or chive
  es: Cebolla, ajo, puerro o cebollino
category: food
aliases:
  en: [onion, onions, onion powder, garlic, garlic powder, leek, leeks, chive, chives, shallot, shallots, scallion, scallions, spring onion]
  es: [cebolla, cebollas, cebolla en polvo, ajo, ajos, ajo en polvo, puerro, puerros, cebollino, cebollino fresco, chalota, chalotas, cebolleta]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Onions, garlic, leeks and chives damage a dog's red blood cells and can cause anaemia, whether raw, cooked, dried or powdered. Signs usually appear a few days after eating them, once the damage is done, so call your vet even if your dog seems fine."
      es: "La cebolla, el ajo, el puerro y el cebollino dañan los glóbulos rojos del perro y pueden causar anemia, tanto crudos como cocinados, deshidratados o en polvo. Los signos suelen aparecer unos días después, cuando el daño ya está hecho, así que llama a tu veterinario aunque tu perro parezca estar bien."
    signs: [vomiting, lethargy, weakness, pale_gums, tachycardia, panting]
    onset_hours: { min: 24, max: 120 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Cats are the most sensitive of all species to onions, garlic, leeks and chives: even a small amount of cooked onion has poisoned cats. They damage red blood cells and cause anaemia, with signs usually appearing a few days later, so call your vet even if your cat seems fine."
      es: "Los gatos son la especie más sensible a la cebolla, el ajo, el puerro y el cebollino: incluso una pequeña cantidad de cebolla cocinada ha intoxicado a gatos. Dañan los glóbulos rojos y causan anemia, con signos que suelen aparecer unos días después, así que llama a tu veterinario aunque tu gato parezca estar bien."
    signs: [vomiting, lethargy, weakness, pale_gums, tachycardia, panting]
    onset_hours: { min: 24, max: 120 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
  - label: Merck Veterinary Manual — Garlic and Onion (Allium spp) Toxicosis in Animals
    url: https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals
