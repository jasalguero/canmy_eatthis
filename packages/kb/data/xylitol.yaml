id: xylitol
display_name:
  en: Xylitol
  es: Xilitol
category: food
aliases:
  en: [xylitol, birch sugar, birch sugar sweetener, wood sugar, sugar-free gum, sugar free gum, sugar-free candy, sugar-free mints]
  es: [xilitol, azúcar de abedul, edulcorante de abedul, chicle sin azúcar, caramelos sin azúcar]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Xylitol, a sweetener in many sugar-free gums, sweets, mints and baked goods and in some peanut butters, causes a sudden, dangerous drop in blood sugar in dogs and can damage the liver. Signs can start within 30 minutes. Always check the label."
      es: "El xilitol, un edulcorante presente en muchos chicles, caramelos, pastillas de menta y bollería sin azúcar y en algunas cremas de cacahuete, provoca en los perros una bajada repentina y peligrosa del azúcar en sangre y puede dañar el hígado. Los signos pueden empezar en 30 minutos. Revisa siempre la etiqueta."
    signs: [vomiting, weakness, ataxia, lethargy, low_blood_sugar_signs, seizures, coma]
    onset_hours: { min: 0.5, max: 18 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: unknown
    severity: null
    headline:
      en: Not sure — cats aren't known to be affected the same way, but ask your vet.
      es: No estoy seguro — no se sabe que afecte a los gatos igual, pero consulta a tu veterinario.
    summary:
      en: "Xylitol poisoning has only been reported in dogs, and cats don't seem to be at the same risk. That still isn't enough for us to give you an answer for cats, so ask your vet if you're unsure."
      es: "La intoxicación por xilitol solo se ha descrito en perros, y los gatos no parecen correr el mismo riesgo. Aun así, eso no basta para darte una respuesta sobre gatos, así que consulta a tu veterinario si tienes dudas."
    signs: []
    onset_hours: null
    emergency_actions: []
sources:
