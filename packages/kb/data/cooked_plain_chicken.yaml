id: cooked_plain_chicken
display_name:
  en: Plain cooked chicken
  es: Pollo cocinado sin condimentar
category: food
aliases:
  en: [cooked chicken, plain chicken, boiled chicken, baked chicken, chicken breast, cooked chicken breast]
  es: [pollo cocinado, pollo cocido, pollo hervido, pollo al horno, pechuga de pollo]
confusable_with: []
is_ingredient: true
high_risk: false
species:
  dog:
    verdict: safe
    severity: null
    headline:
      en: No known risk from plain cooked chicken.
      es: Sin riesgo conocido con pollo cocinado sin condimentar.
    summary:
      en: Plain chicken breast, boiled or baked, is on university veterinary nutritionists' lists of healthy treats for dogs. Treats should make up no more than 10% of your dog's daily calories, and may not suit a dog with a medical condition, so check with your vet.
      es: La pechuga de pollo sin condimentar, hervida o al horno, figura en las listas de premios saludables de nutricionistas veterinarios universitarios para perros. Los premios no deberían superar el 10 % de las calorías diarias de tu perro, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario.
    signs: []
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: safe
    severity: null
    headline:
      en: No known risk from plain cooked chicken.
      es: Sin riesgo conocido con pollo cocinado sin condimentar.
    summary:
      en: Plain chicken breast, boiled or baked, is on university veterinary nutritionists' lists of healthy treats for cats. Treats should make up no more than 10% of your cat's daily calories, and may not suit a cat with a medical condition, so check with your vet.
      es: La pechuga de pollo sin condimentar, hervida o al horno, figura en las listas de premios saludables de nutricionistas veterinarios universitarios para gatos. Los premios no deberían superar el 10 % de las calorías diarias de tu gato, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario.
    signs: []
    onset_hours: null
