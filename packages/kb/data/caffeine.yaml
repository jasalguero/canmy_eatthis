id: caffeine
display_name:
  en: Caffeine
  es: Cafeína
category: food
aliases:
  en: [caffeine, coffee, coffee grounds, coffee beans, tea bags, energy drink, energy drinks, caffeine pills, espresso]
  es: [cafeína, café, posos de café, granos de café, bolsitas de té, bebida energética, bebidas energéticas, pastillas de cafeína, café molido]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Caffeine, in coffee, tea, energy drinks and caffeine pills, overstimulates a dog's heart and nervous system, causing restlessness, a racing heart, tremors and, in severe cases, seizures. How serious it is depends on how much was eaten, which you can't judge at home, so call your vet."
      es: "La cafeína, presente en el café, el té, las bebidas energéticas y las pastillas de cafeína, sobreestimula el corazón y el sistema nervioso del perro y provoca inquietud, ritmo cardíaco acelerado, temblores y, en casos graves, convulsiones. La gravedad depende de cuánto haya comido, y eso no se puede valorar en casa, así que llama a tu veterinario."
    signs: [restlessness, tachycardia, tremors, seizures, coma]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Caffeine, in coffee, tea, energy drinks and caffeine pills, overstimulates a cat's heart and nervous system, causing restlessness, a racing heart, tremors and, in severe cases, seizures. How serious it is depends on how much was eaten, which you can't judge at home, so call your vet."
      es: "La cafeína, presente en el café, el té, las bebidas energéticas y las pastillas de cafeína, sobreestimula el corazón y el sistema nervioso del gato y provoca inquietud, ritmo cardíaco acelerado, temblores y, en casos graves, convulsiones. La gravedad depende de cuánto haya comido, y eso no se puede valorar en casa, así que llama a tu veterinario."
    signs: [restlessness, tachycardia, tremors, seizures, coma]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
