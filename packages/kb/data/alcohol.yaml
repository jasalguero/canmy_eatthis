id: alcohol
display_name:
  en: Alcohol
  es: Alcohol
category: food
aliases:
  en: [alcohol, beer, wine, spirits, liquor, ethanol, alcoholic drink, cocktail, hand sanitizer, hand sanitiser]
  es: [alcohol, cerveza, vino, licor, licores, bebida alcohólica, cóctel, gel hidroalcohólico, desinfectante de manos]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Alcohol poisons dogs. Beer, wine, spirits, alcohol-based hand sanitiser and fermenting bread dough can all cause it. Signs usually start within 30 to 60 minutes: vomiting, wobbliness and drowsiness, and in severe cases dangerously slow breathing, a low body temperature and coma."
      es: "El alcohol intoxica a los perros. La cerveza, el vino, los licores, el gel hidroalcohólico y la masa de pan en fermentación pueden causarlo. Los signos suelen empezar entre 30 y 60 minutos después: vómitos, falta de coordinación y somnolencia, y en casos graves una respiración peligrosamente lenta, temperatura corporal baja y coma."
    signs: [vomiting, diarrhoea, ataxia, lethargy, difficulty_breathing, coma]
    onset_hours: { min: 0.5, max: 1 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Alcohol poisons cats too, from drinks, alcohol-based hand sanitiser or fermenting bread dough. Signs usually start within 30 to 60 minutes: vomiting, wobbliness and drowsiness, and in severe cases dangerously slow breathing, a low body temperature and coma."
      es: "El alcohol también intoxica a los gatos, ya sea de bebidas, gel hidroalcohólico o masa de pan en fermentación. Los signos suelen empezar entre 30 y 60 minutos después: vómitos, falta de coordinación y somnolencia, y en casos graves una respiración peligrosamente lenta, temperatura corporal baja y coma."
    signs: [vomiting, diarrhoea, ataxia, lethargy, difficulty_breathing, coma]
    onset_hours: { min: 0.5, max: 1 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
