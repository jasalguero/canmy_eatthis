id: raw_yeast_dough
display_name:
  en: Raw yeast dough
  es: Masa de pan cruda con levadura
category: food
aliases:
  en: [raw dough, yeast dough, bread dough, pizza dough, unbaked dough, rising dough]
  es: [masa cruda, masa de pan, masa con levadura, masa de pizza cruda, masa sin hornear]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: A warm stomach is an ideal place for raw yeast dough to keep rising, stretching the stomach, and the yeast produces alcohol as it ferments — so a dog gets both a mechanical problem and alcohol poisoning from the same mouthful.
      es: Un estómago caliente es un lugar ideal para que la masa cruda con levadura siga creciendo, dilatando el estómago, y la levadura produce alcohol al fermentar — así que el perro sufre a la vez un problema mecánico y una intoxicación alcohólica por el mismo bocado.
    signs: [bloating, lethargy, ataxia, disorientation, weakness, low_blood_sugar_signs, seizures, coma]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Any animal can be affected by raw yeast dough: it keeps rising in the warm stomach, and the fermenting yeast produces alcohol. If your cat ate some, call your vet."
      es: "La masa cruda con levadura puede afectar a cualquier animal: sigue creciendo en el estómago caliente y la levadura, al fermentar, produce alcohol. Si tu gato ha comido, llama a tu veterinario."
    signs: [bloating, lethargy, ataxia, disorientation, weakness, low_blood_sugar_signs, seizures, coma]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
  - label: Merck Veterinary Manual — Bread Dough Toxicosis in Animals
    url: https://www.merckvetmanual.com/toxicology/food-hazards/bread-dough-toxicosis-in-animals
