    headline:
      en: No known risk from plain popcorn.
      es: Sin riesgo conocido con palomitas sin sal.
    summary:
      en: "Air-popped popcorn, with no salt or butter, is on university veterinary nutritionists' lists of healthy treats for dogs. Treats should make up no more than 10% of your dog's daily calories, and may not suit a dog with a medical condition, so check with your vet."
      es: "Las palomitas hechas con aire, sin sal ni mantequilla, figuran en las listas de premios saludables de nutricionistas veterinarios universitarios para perros. Los premios no deberían superar el 10 % de las calorías diarias de tu perro, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario."
    signs: []
    onset_hours: null
    emergency_actions: []
