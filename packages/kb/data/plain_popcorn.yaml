      es: "Las palomitas hechas con aire, sin sal ni mantequilla, figuran en las listas de premios saludables de nutricionistas veterinarios universitarios para gatos. Los premios no deberían superar el 10 % de las calorías diarias de tu gato, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario."
