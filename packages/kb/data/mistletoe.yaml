species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Mistletoe can cause vomiting, severe diarrhoea, fast laboured breathing and shock, and can be fatal. Call your vet now."
      es: "El muérdago puede provocar vómitos, diarrea intensa, respiración rápida y trabajosa y shock, y puede ser mortal. Llama ahora a tu veterinario."
    signs: [vomiting, diarrhoea, difficulty_breathing, collapse]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
