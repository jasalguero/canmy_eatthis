id: daffodil
display_name:
  en: Daffodil
  es: Narciso
category: plant
aliases:
  en: [daffodil, daffodils, daffodil bulb, narcissus, jonquil, paperwhite]
  es: [narciso, narcisos, bulbo de narciso, junquillo]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from dogs.
      es: Mejor mantenerlo alejado de los perros.
    summary:
      en: "Daffodil bulbs are poisonous. A small nibble usually causes few or no signs, but eating more, especially a bulb, can cause vomiting, stomach pain and diarrhoea, which can lead to dehydration. Call your vet if your pet ate a bulb or shows these signs."
      es: "Los bulbos de narciso son venenosos. Un mordisco pequeño suele causar pocos signos o ninguno, pero comer más, sobre todo un bulbo, puede provocar vómitos, dolor abdominal y diarrea, que pueden llevar a la deshidratación. Llama a tu veterinario si tu mascota se ha comido un bulbo o presenta estos signos."
    signs: [vomiting, abdominal_pain, diarrhoea]
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from cats.
      es: Mejor mantenerlo alejado de los gatos.
    summary:
      en: "Daffodil bulbs are poisonous. A small nibble usually causes few or no signs, but eating more, especially a bulb, can cause vomiting, stomach pain and diarrhoea, which can lead to dehydration. Call your vet if your pet ate a bulb or shows these signs."
      es: "Los bulbos de narciso son venenosos. Un mordisco pequeño suele causar pocos signos o ninguno, pero comer más, sobre todo un bulbo, puede provocar vómitos, dolor abdominal y diarrea, que pueden llevar a la deshidratación. Llama a tu veterinario si tu mascota se ha comido un bulbo o presenta estos signos."
    signs: [vomiting, abdominal_pain, diarrhoea]
    onset_hours: null
    emergency_actions: []
