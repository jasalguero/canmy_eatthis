id: zinc_pennies
display_name:
  en: Zinc coins (US pennies)
  es: Monedas de zinc (centavos de dólar)
category: household
aliases:
  en: [penny, pennies, us penny, zinc penny, zinc]
  es: [centavo de dólar, moneda de un centavo, zinc]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "US pennies minted after 1982 are mostly zinc. Swallowed, they can release zinc that destroys red blood cells and damages the kidneys, which can be fatal. Call your vet: a coin may need to be removed."
      es: "Los centavos de dólar estadounidenses acuñados después de 1982 son sobre todo de zinc. Si se tragan, pueden liberar zinc, que destruye los glóbulos rojos y daña los riñones, y puede ser mortal. Llama a tu veterinario: puede que haya que extraer la moneda."
    signs: [pale_gums, jaundice, kidney_failure_signs]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet now.
      es: Tóxico para gatos. Llama ahora a tu veterinario.
    summary:
      en: "US pennies minted after 1982 are mostly zinc. Swallowed, they can release zinc that destroys red blood cells and damages the kidneys, which can be fatal. Call your vet: a coin may need to be removed."
      es: "Los centavos de dólar estadounidenses acuñados después de 1982 son sobre todo de zinc. Si se tragan, pueden liberar zinc, que destruye los glóbulos rojos y daña los riñones, y puede ser mortal. Llama a tu veterinario: puede que haya que extraer la moneda."
    signs: [pale_gums, jaundice, kidney_failure_signs]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
