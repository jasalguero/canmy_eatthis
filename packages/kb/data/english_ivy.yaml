id: english_ivy
display_name:
  en: English ivy
  es: Hiedra
category: plant
aliases:
  en: [english ivy, ivy, hedera]
  es: [hiedra, hiedra común, hedera]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from dogs.
      es: Mejor mantenerlo alejado de los perros.
    summary:
      en: "English ivy mostly irritates the stomach: eating a lot of it can cause stomach pain and diarrhoea. Keep it out of reach, and call your vet if your dog ate a lot or seems unwell."
      es: "La hiedra irrita sobre todo el estómago: comer mucha puede provocar dolor abdominal y diarrea. Mantenla fuera de su alcance y llama a tu veterinario si tu perro ha comido mucha o no se encuentra bien."
    signs: [abdominal_pain, diarrhoea]
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from cats.
      es: Mejor mantenerlo alejado de los gatos.
    summary:
      en: "English ivy mostly irritates the stomach: eating a lot of it can cause stomach pain and diarrhoea. Keep it out of reach, and call your vet if your cat ate a lot or seems unwell."
      es: "La hiedra irrita sobre todo el estómago: comer mucha puede provocar dolor abdominal y diarrea. Mantenla fuera de su alcance y llama a tu veterinario si tu gato ha comido mucha o no se encuentra bien."
    signs: [abdominal_pain, diarrhoea]
    onset_hours: null
    emergency_actions: []
