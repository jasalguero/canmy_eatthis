id: fatty_foods
display_name:
  en: Fatty and fried foods
  es: Comida grasa y frita
category: food
aliases:
  en: [fatty food, fatty foods, fried food, fried foods, bacon, fat trimmings, greasy food]
  es: [comida grasa, comida frita, fritos, beicon, bacon, tocino, restos de grasa]
confusable_with: []
is_ingredient: false
high_risk: false
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from dogs.
      es: Mejor mantenerlo alejado de los perros.
    summary:
      en: "Fatty, rich and fried foods — bacon, fat trimmings, fried leftovers — can upset a dog's stomach, causing vomiting and diarrhoea. Keep them to the odd tiny piece, or avoid them, and call your vet if your dog seems unwell."
      es: "La comida grasa, pesada o frita —beicon, restos de grasa, sobras fritas— puede sentarle mal a tu perro y provocar vómitos y diarrea. Dale como mucho un trocito de vez en cuando, o nada, y llama a tu veterinario si no se encuentra bien."
    signs: [vomiting, diarrhoea]
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from cats.
      es: Mejor mantenerlo alejado de los gatos.
    summary:
      en: "Fatty, rich and fried foods — bacon, fat trimmings, fried leftovers — can upset a cat's stomach, causing vomiting and diarrhoea. Keep them to the odd tiny piece, or avoid them, and call your vet if your cat seems unwell."
      es: "La comida grasa, pesada o frita —beicon, restos de grasa, sobras fritas— puede sentarle mal a tu gato y provocar vómitos y diarrea. Dale como mucho un trocito de vez en cuando, o nada, y llama a tu veterinario si no se encuentra bien."
    signs: [vomiting, diarrhoea]
    onset_hours: null
    emergency_actions: []
