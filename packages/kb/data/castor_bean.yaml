id: castor_bean
display_name:
  en: Castor bean
  es: Ricino
category: plant
aliases:
  en: [castor bean, castor beans, castor oil plant, ricinus]
  es: [ricino, semilla de ricino, semillas de ricino, higuera infernal]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Castor bean is one of the plants most often reported to cause serious, sometimes life-threatening, poisoning in dogs and cats. Early signs such as vomiting, drooling or tiredness don't show how serious it may become, so call your vet now."
      es: "El ricino es una de las plantas que con más frecuencia se asocian a intoxicaciones graves, a veces mortales, en perros y gatos. Los primeros signos, como vómitos, babeo o cansancio, no reflejan hasta dónde puede llegar, así que llama ahora a tu veterinario."
    signs: [vomiting, hypersalivation, lethargy, loss_of_appetite, diarrhoea]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet now.
      es: Tóxico para gatos. Llama ahora a tu veterinario.
    summary:
      en: "Castor bean is one of the plants most often reported to cause serious, sometimes life-threatening, poisoning in dogs and cats. Early signs such as vomiting, drooling or tiredness don't show how serious it may become, so call your vet now."
      es: "El ricino es una de las plantas que con más frecuencia se asocian a intoxicaciones graves, a veces mortales, en perros y gatos. Los primeros signos, como vómitos, babeo o cansancio, no reflejan hasta dónde puede llegar, así que llama ahora a tu veterinario."
    signs: [vomiting, hypersalivation, lethargy, loss_of_appetite, diarrhoea]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
