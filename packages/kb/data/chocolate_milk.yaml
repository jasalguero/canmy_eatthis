id: chocolate_milk
display_name:
  en: Milk chocolate
  es: Chocolate con leche
category: food
aliases:
  en: [milk chocolate, chocolate bar, chocolate candy, chocolate bunny, chocolate egg]
  es: [chocolate con leche, chocolate de leche, tableta de chocolate, bombón de chocolate, huevo de chocolate, conejo de chocolate]
confusable_with: [chocolate_dark]
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: mild
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Milk chocolate has much less theobromine than dark chocolate, but it can still poison a dog, and the more it eats the more serious it gets. Call your vet."
      es: "El chocolate con leche tiene mucha menos teobromina que el chocolate negro, pero aun así puede intoxicar a un perro, y cuanto más coma, más grave es. Llama a tu veterinario."
    signs: [vomiting, diarrhoea, restlessness, tachycardia, tremors]
    onset_hours: { min: 6, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: mild
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Milk chocolate contains the same toxin as dark chocolate, in smaller amounts, and chocolate is poisonous to cats. If your cat ate some, call your vet."
      es: "El chocolate con leche contiene la misma sustancia tóxica que el chocolate negro, en menor cantidad, y el chocolate es tóxico para los gatos. Si tu gato ha comido, llama a tu veterinario."
    signs: [vomiting, diarrhoea, restlessness, tachycardia, tremors]
    onset_hours: { min: 6, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
  - label: Merck Veterinary Manual — Chocolate Toxicosis in Animals
    url: https://www.merckvetmanual.com/toxicology/food-hazards/chocolate-toxicosis-in-animals
    accessed: 2026-09-29
  - label: "Kovalkovičová et al., \"Some food toxic for pets\", Interdisciplinary Toxicology (2009)"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2984110/
    accessed: 2026-09-29
  - label: Cornell Feline Health Center — Poisons
    url: https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center/health-information/feline-health-topics/poisons
    accessed: 2026-09-29
