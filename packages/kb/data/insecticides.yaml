id: insecticides
display_name:
  en: Insecticides and fly bait (organophosphates)
  es: Insecticidas y cebos para moscas (organofosforados)
category: chemical
aliases:
  en: [insecticide, insecticides, organophosphate, fly bait, garden insecticide, pesticide]
  es: [insecticida, insecticidas, organofosforado, cebo para moscas, insecticida de jardín, plaguicida]
confusable_with: [permethrin]
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Organophosphate insecticides — in some garden insecticides, fly baits and older flea products — cause drooling, vomiting, diarrhoea, twitching and breathing difficulty in dogs, and can progress to seizures and death. Signs usually start within minutes to hours. Call your vet now and bring the packaging."
      es: "Los insecticidas organofosforados —en algunos insecticidas de jardín, cebos para moscas y antiparasitarios antiguos— provocan en los perros babeo, vómitos, diarrea, temblores musculares y dificultad para respirar, y pueden progresar a convulsiones y la muerte. Los signos suelen empezar en minutos u horas. Llama ahora a tu veterinario y lleva el envase."
    signs: [hypersalivation, vomiting, diarrhoea, increased_urination, difficulty_breathing, tremors, weakness, seizures]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet now.
      es: Tóxico para gatos. Llama ahora a tu veterinario.
    summary:
      en: "Organophosphate insecticides — in some garden insecticides, fly baits and older flea products — cause drooling, vomiting, diarrhoea, twitching and breathing difficulty in cats, and can progress to seizures and death. Signs usually start within minutes to hours. Call your vet now and bring the packaging."
      es: "Los insecticidas organofosforados —en algunos insecticidas de jardín, cebos para moscas y antiparasitarios antiguos— provocan en los gatos babeo, vómitos, diarrea, temblores musculares y dificultad para respirar, y pueden progresar a convulsiones y la muerte. Los signos suelen empezar en minutos u horas. Llama ahora a tu veterinario y lleva el envase."
    signs: [hypersalivation, vomiting, diarrhoea, increased_urination, difficulty_breathing, tremors, weakness, seizures]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
