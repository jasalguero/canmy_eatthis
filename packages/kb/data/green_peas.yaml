    summary:
      en: "One university veterinary list includes peas as a treat for cats, which isn't enough for us to give you an answer. Ask your vet if you're unsure."
      es: "Una lista veterinaria universitaria incluye los guisantes como premio para gatos, pero eso no basta para darte una respuesta. Consulta a tu veterinario si tienes dudas."
