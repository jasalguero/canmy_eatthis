    headline:
      en: No known risk from green beans.
      es: Sin riesgo conocido con judías verdes.
    summary:
      en: "Green beans, raw or steamed, are on university veterinary nutritionists' lists of healthy treats for dogs. Treats should make up no more than 10% of your dog's daily calories, and may not suit a dog with a medical condition, so check with your vet."
      es: "Las judías verdes, crudas o al vapor, figuran en las listas de premios saludables de nutricionistas veterinarios universitarios para perros. Los premios no deberían superar el 10 % de las calorías diarias de tu perro, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario."
    signs: []
    onset_hours: null
    emergency_actions: []
