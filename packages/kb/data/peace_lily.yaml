id: peace_lily
display_name:
  en: Peace lily
  es: Espatifilo
category: plant
aliases:
  en: [peace lily, spathiphyllum]
  es: [espatifilo, lirio de la paz, cuna de moisés, spathiphyllum]
confusable_with: [lily]
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from dogs.
      es: Mejor mantenerlo alejado de los perros.
    summary:
      en: "Peace lily contains crystals that cause immediate pain, burning and swelling in the mouth, with drooling. Serious poisoning is rare, but call your vet if your dog has trouble breathing or swallowing."
      es: "El espatifilo contiene cristales que provocan de inmediato dolor, ardor e hinchazón en la boca, con babeo. Las intoxicaciones graves son poco frecuentes, pero llama a tu veterinario si a tu perro le cuesta respirar o tragar."
    signs: [mouth_irritation, hypersalivation]
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from cats.
      es: Mejor mantenerlo alejado de los gatos.
    summary:
      en: "Peace lily contains crystals that cause immediate pain, burning and swelling in the mouth, with drooling. Serious poisoning is rare, but call your vet if your cat has trouble breathing or swallowing."
      es: "El espatifilo contiene cristales que provocan de inmediato dolor, ardor e hinchazón en la boca, con babeo. Las intoxicaciones graves son poco frecuentes, pero llama a tu veterinario si a tu gato le cuesta respirar o tragar."
    signs: [mouth_irritation, hypersalivation]
    onset_hours: null
    emergency_actions: []
