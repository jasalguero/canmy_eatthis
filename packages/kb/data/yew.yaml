id: yew
display_name:
  en: Yew
  es: Tejo
category: plant
aliases:
  en: [yew, yews, yew tree, yew bush, taxus, english yew, japanese yew]
  es: [tejo, tejos, taxus]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Yew is extremely poisonous. It can stop the heart, and once signs appear, treatment often can't help. If your pet has chewed any part of a yew, call your vet immediately, before any signs appear."
      es: "El tejo es extremadamente venenoso. Puede detener el corazón y, una vez aparecen los signos, el tratamiento a menudo no sirve de nada. Si tu mascota ha mordido cualquier parte de un tejo, llama inmediatamente a tu veterinario, antes de que aparezca ningún signo."
    signs: [restlessness, tremors, ataxia, difficulty_breathing, collapse, irregular_heartbeat]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
