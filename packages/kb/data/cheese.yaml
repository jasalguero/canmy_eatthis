    summary:
      en: "A university veterinary hospital lists cheese as a treat for pets, but we haven't found a second source to confirm it for dogs, so we can't give you an answer. Ask your vet if you're unsure."
      es: "Un hospital veterinario universitario incluye el queso entre los premios para mascotas, pero no hemos encontrado una segunda fuente que lo confirme para perros, así que no podemos darte una respuesta. Consulta a tu veterinario si tienes dudas."
    signs: []
