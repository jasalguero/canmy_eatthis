  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept to a tiny amount, if any.
      es: Mejor limitarlo a una cantidad mínima, si acaso.
    summary:
      en: "Many cats can't digest lactose, the sugar in milk, once they are grown, and dairy products can upset their stomach. Cheese is best kept to a very small amount, or avoided."
      es: "Muchos gatos adultos no pueden digerir la lactosa, el azúcar de la leche, y los productos lácteos pueden sentarles mal al estómago. Es mejor darles muy poco queso, o nada."
    signs: [diarrhoea]
    onset_hours: null
    emergency_actions: []
