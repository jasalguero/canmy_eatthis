id: chocolate_dark
display_name:
  en: Dark chocolate
  es: Chocolate negro
category: food
aliases:
  en: [dark chocolate, baking chocolate, bittersweet chocolate, semisweet chocolate, cocoa powder, unsweetened chocolate, cooking chocolate, cocoa solids, cacao powder]
  es: [chocolate negro, chocolate amargo, chocolate para postres, chocolate de cobertura, cacao en polvo, chocolate puro, chocolate fondant]
confusable_with: [chocolate_milk]
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Dark chocolate is rich in theobromine, a stimulant dogs clear very slowly. Even a modest amount of dark or baking chocolate can bring on vomiting, a racing heart, tremors or seizures, usually within 6 to 12 hours."
      es: "El chocolate negro es rico en teobromina, un estimulante que los perros eliminan muy despacio. Incluso una cantidad moderada de chocolate negro o de repostería puede provocar vómitos, ritmo cardíaco acelerado, temblores o convulsiones, normalmente entre 6 y 12 horas después."
    signs: [vomiting, diarrhoea, restlessness, tachycardia, tremors, seizures, hyperthermia]
    onset_hours: { min: 6, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Chocolate is poisonous to cats too, and can cause an abnormal heartbeat, tremors and seizures. If your cat ate some, call your vet."
      es: "El chocolate también es tóxico para los gatos y puede provocar alteraciones del ritmo cardíaco, temblores y convulsiones. Si tu gato ha comido, llama a tu veterinario."
    signs: [vomiting, diarrhoea, restlessness, tachycardia, tremors, seizures, hyperthermia]
    onset_hours: { min: 6, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
