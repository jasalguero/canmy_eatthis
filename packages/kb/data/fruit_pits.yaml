species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from dogs.
      es: Mejor mantenerlo alejado de los perros.
    summary:
      en: "The main risk from fruit pits is a blocked gut. The pits also contain cyanide, but it's only released when they're crushed or chewed, so poisoning is rare unless a pet chews up a lot of them. Call your vet if your pet swallowed a pit whole or chewed several."
      es: "El principal riesgo de los huesos de fruta es que obstruyan el intestino. También contienen cianuro, pero solo se libera al triturarlos o masticarlos, así que la intoxicación es rara salvo que la mascota mastique muchos. Llama a tu veterinario si tu mascota se ha tragado un hueso entero o ha masticado varios."
    signs: []
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: caution
    severity: null
    headline:
      en: Best kept away from cats.
      es: Mejor mantenerlo alejado de los gatos.
    summary:
      en: "The main risk from fruit pits is a blocked gut. The pits also contain cyanide, but it's only released when they're crushed or chewed, so poisoning is rare unless a pet chews up a lot of them. Call your vet if your pet swallowed a pit whole or chewed several."
      es: "El principal riesgo de los huesos de fruta es que obstruyan el intestino. También contienen cianuro, pero solo se libera al triturarlos o masticarlos, así que la intoxicación es rara salvo que la mascota mastique muchos. Llama a tu veterinario si tu mascota se ha tragado un hueso entero o ha masticado varios."
