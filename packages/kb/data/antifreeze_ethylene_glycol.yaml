id: antifreeze_ethylene_glycol
display_name:
  en: Antifreeze (ethylene glycol)
  es: Anticongelante (etilenglicol)
category: chemical
aliases:
  en: [antifreeze, ethylene glycol, car coolant, radiator fluid, engine coolant, windshield de-icer]
  es: [anticongelante, etilenglicol, refrigerante de coche, líquido refrigerante, líquido anticongelante]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Emergency — call your vet now.
      es: Tóxico para perros. Emergencia — llama ahora a tu veterinario.
    summary:
      en: "Antifreeze tastes sweet, so dogs drink it readily, and it can be fatal. Within 30 minutes to 12 hours it causes signs like drunkenness — vomiting, wobbliness, drinking and urinating more — followed by kidney failure a few days later. Treatment works best the sooner it starts, so call your vet immediately, even if your dog seems fine."
      es: "El anticongelante tiene un sabor dulce, así que los perros lo beben con facilidad, y puede ser mortal. Entre 30 minutos y 12 horas después provoca signos parecidos a una borrachera —vómitos, falta de coordinación, beber y orinar más— y, unos días después, fallo renal. El tratamiento funciona mejor cuanto antes empiece, así que llama inmediatamente a tu veterinario, aunque tu perro parezca estar bien."
    signs: [vomiting, ataxia, lethargy, increased_thirst, increased_urination, seizures, kidney_failure_signs, coma]
    onset_hours: { min: 0.5, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Emergency — call your vet now.
      es: Tóxico para gatos. Emergencia — llama ahora a tu veterinario.
    summary:
      en: "Cats are even more sensitive to antifreeze than dogs, and kidney failure can follow within 12 to 24 hours. Its sweet taste makes it easy to swallow. Treatment works best the sooner it starts, so call your vet immediately, even if your cat seems fine."
      es: "Los gatos son aún más sensibles al anticongelante que los perros, y el fallo renal puede llegar en 12 a 24 horas. Su sabor dulce hace que se trague con facilidad. El tratamiento funciona mejor cuanto antes empiece, así que llama inmediatamente a tu veterinario, aunque tu gato parezca estar bien."
    signs: [vomiting, ataxia, lethargy, increased_thirst, increased_urination, seizures, kidney_failure_signs, coma]
    onset_hours: { min: 0.5, max: 12 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
