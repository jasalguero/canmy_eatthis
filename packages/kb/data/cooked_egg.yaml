species:
  dog:
    verdict: safe
    severity: null
    headline:
      en: No known risk from cooked egg.
      es: Sin riesgo conocido con huevo cocido.
    summary:
      en: "Cooked egg, such as hard-boiled, is on university veterinary nutritionists' lists of healthy treats for dogs. Treats should make up no more than 10% of your dog's daily calories, and may not suit a dog with a medical condition, so check with your vet."
      es: "El huevo cocido, por ejemplo duro, figura en las listas de premios saludables de nutricionistas veterinarios universitarios para perros. Los premios no deberían superar el 10 % de las calorías diarias de tu perro, y pueden no ser adecuados si tiene alguna enfermedad, así que consulta a tu veterinario."
    signs: []
    onset_hours: null
    emergency_actions: []
