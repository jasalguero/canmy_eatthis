id: rodenticide
display_name:
  en: Rat or mouse poison
  es: Veneno para ratas o ratones
category: chemical
aliases:
  en: [rat poison, mouse poison, rodenticide, rat bait, mouse bait, rodent bait]
  es: [veneno para ratas, veneno para ratones, raticida, cebo para ratas, cebo para ratones, matarratas]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Emergency — call your vet now.
      es: Tóxico para perros. Emergencia — llama ahora a tu veterinario.
    summary:
      en: "Rat and mouse baits use different poisons. Some cause internal bleeding that only shows 3 to 7 days later; others cause seizures or kidney damage. Treat any ingestion as an emergency, even if your dog seems fine, and bring the packaging so your vet knows which poison it is."
      es: "Los venenos para ratas y ratones usan sustancias distintas. Unas provocan hemorragias internas que no se notan hasta 3 a 7 días después; otras, convulsiones o daño renal. Trata cualquier ingestión como una emergencia, aunque tu perro parezca estar bien, y lleva el envase para que tu veterinario sepa qué veneno es."
    signs: [loss_of_appetite, lethargy, weakness, difficulty_breathing, blood_in_vomit, blood_in_stool, tachycardia, seizures, kidney_failure_signs]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Emergency — call your vet now.
      es: Tóxico para gatos. Emergencia — llama ahora a tu veterinario.
    summary:
      en: "Cats can be poisoned by eating bait, or by eating a rodent that ate it. Rat and mouse baits use different poisons: some cause internal bleeding days later, others seizures or kidney damage. Call your vet now and bring the packaging."
      es: "Los gatos pueden intoxicarse al comer el cebo o al comerse un roedor que lo haya comido. Los venenos para ratas y ratones usan sustancias distintas: unas provocan hemorragias internas días después; otras, convulsiones o daño renal. Llama ahora a tu veterinario y lleva el envase."
    signs: [loss_of_appetite, lethargy, weakness, difficulty_breathing, blood_in_vomit, blood_in_stool, tachycardia, seizures, kidney_failure_signs]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
