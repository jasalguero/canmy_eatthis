high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Kalanchoe is one of the plants most often reported to cause serious, sometimes life-threatening, poisoning in dogs and cats. Early signs such as vomiting, drooling or tiredness don't show how serious it may become, so call your vet."
      es: "El kalanchoe es una de las plantas que con más frecuencia se asocian a intoxicaciones graves, a veces mortales, en perros y gatos. Los primeros signos, como vómitos, babeo o cansancio, no reflejan hasta dónde puede llegar, así que llama a tu veterinario."
    signs: [vomiting, hypersalivation, lethargy, loss_of_appetite, diarrhoea]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
