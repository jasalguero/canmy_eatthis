id: kalanchoe
display_name:
  en: Kalanchoe
  es: Kalanchoe
category: plant
aliases:
  en: [kalanchoe, kalanchoes, flaming katy, mother of millions]
  es: [kalanchoe, kalanchoes, calanchoe, madre de miles, aranto]
confusable_with: []
