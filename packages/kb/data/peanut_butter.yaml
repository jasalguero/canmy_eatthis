id: peanut_butter
display_name:
  en: Peanut butter
  es: Crema de cacahuete
category: food
aliases:
  en: [peanut butter, peanut spread, nut butter]
  es: [crema de cacahuete, mantequilla de cacahuete, manteca de maní, crema de maní]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: caution
    severity: null
    headline:
      en: Check the label before sharing.
      es: Revisa la etiqueta antes de dárselo.
    summary:
      en: "Plain smooth peanut butter is on a university veterinary hospital's list of treats, but some peanut butters are sweetened with xylitol, which is dangerous to dogs. Check the label: if it lists xylitol or birch sugar, treat it as xylitol poisoning and call your vet."
      es: "La crema de cacahuete natural figura en la lista de premios de un hospital veterinario universitario, pero algunas están endulzadas con xilitol, que es peligroso para los perros. Revisa la etiqueta: si incluye xilitol o azúcar de abedul, trátalo como una intoxicación por xilitol y llama a tu veterinario."
    signs: []
    onset_hours: null
    emergency_actions: []
  cat:
    verdict: unknown
    severity: null
    headline:
      en: Not sure — ask your vet.
      es: No estoy seguro — consulta a tu veterinario.
    summary:
      en: "One university veterinary list includes plain peanut butter as a treat for cats, which isn't enough for us to give you an answer. Xylitol, the sweetener that makes some peanut butters dangerous to dogs, doesn't seem to be as dangerous for cats. Ask your vet if you're unsure."
      es: "Una lista veterinaria universitaria incluye la crema de cacahuete natural como premio para gatos, pero eso no basta para darte una respuesta. El xilitol, el edulcorante que hace peligrosas algunas cremas de cacahuete para los perros, no parece serlo tanto para los gatos. Consulta a tu veterinario si tienes dudas."
    signs: []
    onset_hours: null
    emergency_actions: []
