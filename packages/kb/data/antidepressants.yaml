id: antidepressants
display_name:
  en: Antidepressants (SSRIs)
  es: Antidepresivos (ISRS)
category: medication
aliases:
  en: [antidepressant, antidepressants, ssri, fluoxetine, prozac, sertraline, zoloft, citalopram, escitalopram, paroxetine]
  es: [antidepresivo, antidepresivos, isrs, fluoxetina, sertralina, citalopram, escitalopram, paroxetina]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: "Antidepressants such as fluoxetine or sertraline can make dogs drowsy, or the opposite: agitated, trembling, with a racing heart or a fever, and occasionally seizures. Most dogs recover well with prompt veterinary care, so call your vet if yours swallowed any."
      es: "Los antidepresivos como la fluoxetina o la sertralina pueden dejar a los perros adormilados, o lo contrario: agitados, temblorosos, con el corazón acelerado o fiebre, y a veces con convulsiones. La mayoría se recupera bien con atención veterinaria rápida, así que llama a tu veterinario si ha tragado alguno."
    signs: [lethargy, agitation, ataxia, tremors, tachycardia, hyperthermia, vomiting, diarrhoea, seizures]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: moderate
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Antidepressants such as fluoxetine or sertraline can make cats drowsy, or the opposite: agitated, trembling, with a racing heart or a fever, and occasionally seizures. Most cats recover well with prompt veterinary care, so call your vet if yours swallowed any."
      es: "Los antidepresivos como la fluoxetina o la sertralina pueden dejar a los gatos adormilados, o lo contrario: agitados, temblorosos, con el corazón acelerado o fiebre, y a veces con convulsiones. La mayoría se recupera bien con atención veterinaria rápida, así que llama a tu veterinario si ha tragado alguno."
    signs: [lethargy, agitation, ataxia, tremors, tachycardia, hyperthermia, vomiting, diarrhoea, seizures]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
