id: grapes_raisins
display_name:
  en: Grapes and raisins
  es: Uvas y pasas
category: food
aliases:
  en: [grapes, raisins, sultanas, currants, grape, raisin, sultana, currant, dried grapes, zante currants]
  es: [uvas, pasas, pasas de uva, uva pasa, sultanas, grosellas de corinto, uva]
confusable_with: []
is_ingredient: true
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet.
      es: Tóxico para perros. Llama a tu veterinario.
    summary:
      en: Grapes, raisins and currants can cause sudden kidney failure in dogs. No amount is known to be reliably safe, and some dogs are affected by very small quantities while others tolerate more — there's no way to tell in advance.
      es: Las uvas, las pasas y las grosellas de Corinto pueden provocar un fallo renal repentino en perros. No se conoce ninguna cantidad que sea claramente segura, y algunos perros se ven afectados con cantidades muy pequeñas mientras que otros toleran más, sin forma de saberlo de antemano.
    signs: [vomiting, diarrhoea, lethargy, abdominal_pain, increased_thirst, increased_urination, kidney_failure_signs]
    onset_hours: { min: 6, max: 24 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet.
      es: Tóxico para gatos. Llama a tu veterinario.
    summary:
      en: "Cats have been reported to develop kidney failure after eating grapes or raisins, although these reports are anecdotal and far fewer than in dogs. Treat it as serious and call your vet."
      es: "Se han descrito casos de gatos con fallo renal tras comer uvas o pasas, aunque son casos anecdóticos y muchos menos que en perros. Tómatelo en serio y llama a tu veterinario."
    signs: [vomiting, diarrhoea, lethargy, abdominal_pain, increased_thirst, increased_urination, kidney_failure_signs]
    onset_hours: { min: 6, max: 24 }
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
sources:
