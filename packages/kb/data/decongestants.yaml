id: decongestants
display_name:
  en: "Decongestants (pseudoephedrine, phenylephrine)"
  es: "Descongestionantes (pseudoefedrina, fenilefrina)"
category: medication
aliases:
  en: [decongestant, decongestants, pseudoephedrine, sudafed, phenylephrine]
  es: [descongestionante, descongestionantes, pseudoefedrina, fenilefrina]
confusable_with: []
is_ingredient: false
high_risk: true
species:
  dog:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to dogs. Call your vet now.
      es: Tóxico para perros. Llama ahora a tu veterinario.
    summary:
      en: "Decongestants such as pseudoephedrine and phenylephrine, found in many cold and allergy medicines, can make dogs agitated and hyperactive, with a racing or irregular heart, trembling and overheating, and can be fatal. Call your vet immediately and bring the packaging."
      es: "Los descongestionantes como la pseudoefedrina y la fenilefrina, presentes en muchos medicamentos para el resfriado y la alergia, pueden provocar en los perros agitación e hiperactividad, corazón acelerado o irregular, temblores y temperatura muy alta, y pueden ser mortales. Llama inmediatamente a tu veterinario y lleva el envase."
    signs: [agitation, restlessness, tachycardia, irregular_heartbeat, tremors, hyperthermia, vomiting]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
  cat:
    verdict: toxic
    severity: severe
    headline:
      en: Toxic to cats. Call your vet now.
      es: Tóxico para gatos. Llama ahora a tu veterinario.
    summary:
      en: "Decongestants such as pseudoephedrine and phenylephrine, found in many cold and allergy medicines, can make cats agitated and hyperactive, with a racing or irregular heart, trembling and overheating, and can be fatal. Call your vet immediately and bring the packaging."
      es: "Los descongestionantes como la pseudoefedrina y la fenilefrina, presentes en muchos medicamentos para el resfriado y la alergia, pueden provocar en los gatos agitación e hiperactividad, corazón acelerado o irregular, temblores y temperatura muy alta, y pueden ser mortales. Llama inmediatamente a tu veterinario y lleva el envase."
    signs: [agitation, restlessness, tachycardia, irregular_heartbeat, tremors, hyperthermia, vomiting]
    onset_hours: null
    emergency_actions: [call_vet_now, do_not_induce_vomiting, bring_packaging]
