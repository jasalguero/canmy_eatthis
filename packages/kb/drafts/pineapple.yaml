    headline:
      en: No known risk from pineapple.
      es: Sin riesgo conocido con piña.
    summary:
      en: "Veterinary guidance lists the soft flesh of pineapple as an acceptable treat for dogs in moderation. The core, rind, stem and leaves are hard to chew and digest and can cause choking or blockages. Treats should make up no more than 10% of your dog's daily calories, and pineapple is high in natural sugar, so check with your vet if your dog has diabetes or another medical condition."
      es: "Las guías veterinarias incluyen la pulpa blanda de la piña como un premio aceptable para perros con moderación. El corazón, la cáscara, el tallo y las hojas son difíciles de masticar y digerir y pueden causar atragantamiento u obstrucciones. Los premios no deberían superar el 10 % de las calorías diarias de tu perro, y la piña tiene mucho azúcar natural, así que consulta a tu veterinario si tu perro tiene diabetes u otra enfermedad."
